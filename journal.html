<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WASPN Trading Journal</title>

<style>
:root{
  --bg:#0b0f14;
  --panel:#121820;
  --panel2:#171f29;
  --border:#293342;
  --text:#e8eef6;
  --muted:#8e9aaa;
  --green:#35d07f;
  --red:#ff5f6d;
  --blue:#63a7ff;
  --amber:#f3b84b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#090d12,#0d131a);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:900px;
  margin:0 auto;
  padding:18px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.btn,a.btn{
  border:0;
  background:#293342;
  color:white;
  padding:11px 14px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
  cursor:pointer;
}

.save{background:#17693d}
.delete{background:#6d2530}

.hero,.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.card{margin-top:14px}

h1{
  color:var(--green);
  font-size:40px;
  margin:4px 0 7px;
}

h2{margin:0 0 12px}

.muted{
  color:var(--muted);
  line-height:1.5;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

input,select,textarea{
  width:100%;
  background:#0d131a;
  border:1px solid var(--border);
  color:white;
  border-radius:9px;
  padding:10px;
  font-size:16px;
}

textarea{
  min-height:70px;
  resize:vertical;
}

.trade{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin-top:14px;
}

.trade-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.trade-title{
  font-size:20px;
  font-weight:900;
}

.pnl{
  font-weight:900;
  font-size:20px;
}

.green{color:var(--green)}
.red{color:var(--red)}
.blue{color:var(--blue)}
.amber{color:var(--amber)}

.calculation{
  margin-top:10px;
  padding:10px;
  background:#0d131a;
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.actual{
  border-color:#3b6670;
}

.total{
  text-align:center;
  font-size:46px;
  font-weight:900;
  margin:8px 0;
}

.status{
  margin-top:12px;
  background:#0d131a;
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px;
  text-align:center;
  color:var(--muted);
  line-height:1.5;
}

.existing{
  margin-top:12px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#0d131a;
  color:var(--muted);
  font-size:13px;
}

@media(max-width:650px){
  .wrap{padding:12px}
  .hero,.card{padding:16px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrap">

<div class="topbar">
  <a href="index.html" class="btn">← Home</a>

  <div class="actions">
    <a href="live-risk.html" class="btn">Live Risk</a>
    <a href="calendar-2026.html" class="btn">Calendar</a>
  </div>
</div>


<section class="hero">
  <div class="muted">WASPN • Trades 1–5</div>
  <h1>Trading Journal</h1>
  <div class="muted">
    Use Actual/Broker Net P&amp;L whenever you have partial fills,
    scaled entries/exits or a broker-reported exact result.
  </div>
</section>


<section class="card">

  <div class="grid">

    <div>
      <label>Trading date</label>
      <input id="tradeDate" type="date">
    </div>

    <div>
      <label>Session starting account value</label>
      <input id="startValue" type="number" step="0.01" placeholder="Optional">
    </div>

  </div>

  <div id="existing" class="existing" style="display:none;"></div>

</section>


<div id="trades"></div>


<section class="card">

  <h2>Daily Notes</h2>

  <textarea
    id="dailyNotes"
    placeholder="What worked? What failed? What should be repeated or removed?"
  ></textarea>

</section>


<section class="card">

  <div class="muted" style="text-align:center;">DAILY NET P&amp;L</div>

  <div id="dailyTotal" class="total">
    $0.00
  </div>

  <div class="actions">

    <button id="saveBtn" class="btn save">
      Save Day
    </button>

    <button id="loadBtn" class="btn">
      Reload Saved Day
    </button>

    <button id="deleteBtn" class="btn delete">
      Delete Entire Day
    </button>

  </div>

  <div id="status" class="status">
    No changes saved yet.
  </div>

</section>

</div>


<script>
const STORAGE_KEY = "waspnJournalV2";

const tradeContainer = document.getElementById("trades");


function money(v){
  const n = Number(v || 0);

  if(n > 0) return "+$" + n.toFixed(2);
  if(n < 0) return "-$" + Math.abs(n).toFixed(2);

  return "$0.00";
}


function getJournal(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch{
    return {};
  }
}


function saveJournal(journal){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(journal));
}


function createTrade(i){

  const section = document.createElement("section");

  section.className = "trade";

  section.innerHTML = `
    <div class="trade-head">
      <div class="trade-title">Trade ${i}</div>
      <div id="tradePnl${i}" class="pnl" data-pnl="0">$0.00</div>
    </div>

    <div class="grid">

      <div>
        <label>Ticker</label>
        <input id="ticker${i}" placeholder="ABCD">
      </div>

      <div>
        <label>Side</label>
        <select id="side${i}">
          <option value="long">Long</option>
          <option value="short">Short</option>
        </select>
      </div>

      <div>
        <label>Entry time</label>
        <input id="entryTime${i}" type="time">
      </div>

      <div>
        <label>Exit time</label>
        <input id="exitTime${i}" type="time">
      </div>

      <div>
        <label>Entry price</label>
        <input id="entryPrice${i}" type="number" step="0.0001">
      </div>

      <div>
        <label>Exit price</label>
        <input id="exitPrice${i}" type="number" step="0.0001">
      </div>

      <div>
        <label>Shares</label>
        <input id="shares${i}" type="number" step="1">
      </div>

      <div>
        <label>Fees</label>
        <input id="fees${i}" type="number" step="0.01" value="0">
      </div>

      <div>
        <label>Setup</label>
        <input id="setup${i}" placeholder="Breakout / pullback / etc">
      </div>

      <div>
        <label>Tilt present?</label>
        <select id="tilt${i}">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>
      </div>

    </div>

    <div class="calculation" id="calcText${i}">
      Calculated net: $0.00
    </div>

    <div style="margin-top:11px;">
      <label>
        Actual / Broker Net P&amp;L
        <span style="color:var(--blue);">
          — optional, overrides calculation
        </span>
      </label>

      <input
        id="actualNet${i}"
        class="actual"
        type="number"
        step="0.01"
        placeholder="Exact broker result"
      >
    </div>

    <div style="margin-top:11px;">
      <label>Reason for entry</label>
      <textarea id="entryReason${i}"></textarea>
    </div>

    <div style="margin-top:11px;">
      <label>Reason for exit</label>
      <textarea id="exitReason${i}"></textarea>
    </div>

    <div style="margin-top:11px;">
      <label>Mistake / lesson</label>
      <textarea id="lesson${i}"></textarea>
    </div>
  `;

  tradeContainer.appendChild(section);

  [
    "side",
    "entryPrice",
    "exitPrice",
    "shares",
    "fees",
    "actualNet"
  ].forEach(field=>{
    const el = document.getElementById(field+i);
    el.addEventListener("input",()=>calculateTrade(i));
    el.addEventListener("change",()=>calculateTrade(i));
  });
}


for(let i=1;i<=5;i++){
  createTrade(i);
}


function calculatedNet(i){

  const entry = Number(document.getElementById("entryPrice"+i).value || 0);
  const exit = Number(document.getElementById("exitPrice"+i).value || 0);
  const shares = Number(document.getElementById("shares"+i).value || 0);
  const fees = Number(document.getElementById("fees"+i).value || 0);
  const side = document.getElementById("side"+i).value;

  if(!entry || !exit || !shares){
    return -fees;
  }

  const gross =
    side === "long"
      ? (exit-entry)*shares
      : (entry-exit)*shares;

  return gross-fees;
}


function calculateTrade(i){

  const calc = calculatedNet(i);

  document.getElementById("calcText"+i).textContent =
    "Calculated net: " + money(calc);

  const actualInput = document.getElementById("actualNet"+i);

  const hasActual = actualInput.value.trim() !== "";

  const used = hasActual
    ? Number(actualInput.value)
    : calc;

  const display = document.getElementById("tradePnl"+i);

  display.dataset.pnl = String(used);
  display.textContent = money(used);
  display.className = "pnl " + (used >= 0 ? "green" : "red");

  calculateDailyTotal();
}


function calculateDailyTotal(){

  let total = 0;

  for(let i=1;i<=5;i++){
    total += Number(
      document.getElementById("tradePnl"+i).dataset.pnl || 0
    );
  }

  const el = document.getElementById("dailyTotal");

  el.textContent = money(total);
  el.className = "total " + (total >= 0 ? "green" : "red");
  el.dataset.pnl = String(total);

  return total;
}


function tradeData(i){

  const actualRaw = document.getElementById("actualNet"+i).value.trim();

  const calc = calculatedNet(i);

  const actualNet =
    actualRaw === ""
      ? null
      : Number(actualRaw);

  return {
    ticker:document.getElementById("ticker"+i).value.trim().toUpperCase(),
    side:document.getElementById("side"+i).value,
    entryTime:document.getElementById("entryTime"+i).value,
    exitTime:document.getElementById("exitTime"+i).value,
    entryPrice:Number(document.getElementById("entryPrice"+i).value || 0),
    exitPrice:Number(document.getElementById("exitPrice"+i).value || 0),
    shares:Number(document.getElementById("shares"+i).value || 0),
    fees:Number(document.getElementById("fees"+i).value || 0),
    setup:document.getElementById("setup"+i).value,
    tilt:document.getElementById("tilt"+i).value,
    entryReason:document.getElementById("entryReason"+i).value,
    exitReason:document.getElementById("exitReason"+i).value,
    lesson:document.getElementById("lesson"+i).value,
    calculatedNet:calc,
    actualNet,
    netPnl:actualNet !== null ? actualNet : calc
  };
}


function isTradeUsed(t){
  return Boolean(
    t.ticker ||
    t.entryTime ||
    t.exitTime ||
    t.entryPrice ||
    t.exitPrice ||
    t.shares ||
    t.setup ||
    t.entryReason ||
    t.exitReason ||
    t.lesson ||
    t.actualNet !== null
  );
}


function saveDay(){

  const date = document.getElementById("tradeDate").value;

  if(!date){
    alert("Choose a trading date first.");
    return;
  }

  const journal = getJournal();

  const existing = journal[date] || {};

  const trades = [];

  for(let i=1;i<=5;i++){
    const t = tradeData(i);

    if(isTradeUsed(t)){
      trades.push(t);
    }
  }

  const total = calculateDailyTotal();

  journal[date] = {
    ...existing,
    date,
    startValue:Number(document.getElementById("startValue").value || 0),
    trades,
    totalNet:total,
    notes:document.getElementById("dailyNotes").value,
    journalSavedAt:new Date().toISOString(),
    lastUpdated:new Date().toISOString()
  };

  saveJournal(journal);

  document.getElementById("status").textContent =
    `Saved ${date} • ${trades.length} trade(s) • ${money(total)}`;

  document.getElementById("status").style.color = "var(--green)";

  showExisting();
}


function clearForm(){

  document.getElementById("startValue").value = "";
  document.getElementById("dailyNotes").value = "";

  for(let i=1;i<=5;i++){

    document.getElementById("ticker"+i).value = "";
    document.getElementById("side"+i).value = "long";
    document.getElementById("entryTime"+i).value = "";
    document.getElementById("exitTime"+i).value = "";
    document.getElementById("entryPrice"+i).value = "";
    document.getElementById("exitPrice"+i).value = "";
    document.getElementById("shares"+i).value = "";
    document.getElementById("fees"+i).value = "0";
    document.getElementById("setup"+i).value = "";
    document.getElementById("tilt"+i).value = "no";
    document.getElementById("actualNet"+i).value = "";
    document.getElementById("entryReason"+i).value = "";
    document.getElementById("exitReason"+i).value = "";
    document.getElementById("lesson"+i).value = "";

    calculateTrade(i);
  }
}


function loadDay(){

  const date = document.getElementById("tradeDate").value;

  if(!date) return;

  clearForm();

  const day = getJournal()[date];

  if(!day){
    document.getElementById("status").textContent =
      "No saved Journal entry for " + date;
    showExisting();
    return;
  }

  document.getElementById("startValue").value = day.startValue || "";
  document.getElementById("dailyNotes").value = day.notes || "";

  (day.trades || []).slice(0,5).forEach((t,index)=>{

    const i = index+1;

    document.getElementById("ticker"+i).value = t.ticker || "";
    document.getElementById("side"+i).value = t.side || "long";
    document.getElementById("entryTime"+i).value = t.entryTime || "";
    document.getElementById("exitTime"+i).value = t.exitTime || "";
    document.getElementById("entryPrice"+i).value = t.entryPrice || "";
    document.getElementById("exitPrice"+i).value = t.exitPrice || "";
    document.getElementById("shares"+i).value = t.shares || "";
    document.getElementById("fees"+i).value = t.fees ?? 0;
    document.getElementById("setup"+i).value = t.setup || "";
    document.getElementById("tilt"+i).value = t.tilt || "no";

    document.getElementById("actualNet"+i).value =
      t.actualNet !== null &&
      t.actualNet !== undefined
        ? t.actualNet
        : "";

    document.getElementById("entryReason"+i).value = t.entryReason || "";
    document.getElementById("exitReason"+i).value = t.exitReason || "";
    document.getElementById("lesson"+i).value = t.lesson || "";

    calculateTrade(i);
  });

  document.getElementById("status").textContent =
    "Loaded " + date;

  document.getElementById("status").style.color = "var(--blue)";

  showExisting();
}


function showExisting(){

  const date = document.getElementById("tradeDate").value;

  const box = document.getElementById("existing");

  const day = getJournal()[date];

  if(!day){
    box.style.display = "none";
    return;
  }

  const parts = [];

  if(day.liveRisk){
    parts.push("Live attempt " + (day.liveRisk.attempt || 0));
  }

  if(day.compliance){
    parts.push(
      "Compliance " +
      (typeof day.compliance.score === "number"
        ? day.compliance.score + "/3"
        : "saved")
    );
  }

  if(day.sessionScore){
    parts.push("Session Score " + day.sessionScore.score + "/5");
  }

  box.textContent =
    "Other saved data preserved: " +
    (parts.length ? parts.join(" • ") : "daily record exists");

  box.style.display = "block";
}


function deleteDay(){

  const date = document.getElementById("tradeDate").value;

  if(!date) return;

  const journal = getJournal();

  if(!journal[date]){
    alert("No saved record exists for this date.");
    return;
  }

  if(!confirm(
    `Delete the ENTIRE WASPN record for ${date}? This removes Journal, Live Risk, Compliance and Session Score.`
  )){
    return;
  }

  delete journal[date];

  saveJournal(journal);

  clearForm();

  document.getElementById("status").textContent =
    "Entire daily record deleted.";

  document.getElementById("status").style.color = "var(--red)";

  showExisting();
}


function setToday(){
  const d = new Date();

  document.getElementById("tradeDate").value =
    [
      d.getFullYear(),
      String(d.getMonth()+1).padStart(2,"0"),
      String(d.getDate()).padStart(2,"0")
    ].join("-");
}


document.getElementById("saveBtn").addEventListener("click",saveDay);
document.getElementById("loadBtn").addEventListener("click",loadDay);
document.getElementById("deleteBtn").addEventListener("click",deleteDay);
document.getElementById("tradeDate").addEventListener("change",loadDay);

setToday();
loadDay();
</script>

</body>
</html>
