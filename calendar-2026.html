<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASPN">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WASPN • Performance Review</title>

<style>
:root{
  --bg:#070b10;
  --panel:#10171f;
  --panel2:#151e28;
  --panel3:#0b1117;
  --border:#273442;
  --text:#edf4fb;
  --muted:#8797a7;
  --muted2:#657687;
  --green:#35d07f;
  --red:#ff5f6d;
  --blue:#22c7ff;
  --amber:#f3b84b;
}

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:#070b10;
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(34,199,255,.07),
      transparent 35%
    ),
    #070b10;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    Helvetica,
    sans-serif;
}

button,
input{
  font:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:
    max(10px,env(safe-area-inset-top))
    10px
    max(24px,env(safe-area-inset-bottom));
}

.topbar{
  display:grid;
  grid-template-columns:50px 1fr 50px;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:50px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:13px;
  background:#111922;
  color:white;
  text-decoration:none;
  font-size:19px;
  font-weight:900;
}

.icon-btn:active{
  transform:scale(.97);
}

.product{
  text-align:center;
}

.wordmark{
  color:var(--blue);
  font-size:11px;
  font-weight:950;
  letter-spacing:2.4px;
}

.page-title{
  margin-top:1px;
  font-size:19px;
  font-weight:950;
}

.sub{
  margin:8px 0 10px;
  text-align:center;
  color:var(--muted);
  font-size:9px;
  font-weight:850;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.card{
  margin-top:8px;
  padding:13px;
  background:
    linear-gradient(
      180deg,
      #111921,
      #0d141a
    );
  border:1px solid var(--border);
  border-radius:16px;
}

.label{
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.blue{
  color:var(--blue);
}

.amber{
  color:var(--amber);
}

.muted{
  color:var(--muted);
}

.year-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.metric{
  min-width:0;
  padding:11px;
  background:#090f14;
  border:1px solid var(--border);
  border-radius:11px;
}

.metric-value{
  margin-top:4px;
  font-size:21px;
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  font-variant-numeric:tabular-nums;
}

.metric-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
}

.week-range{
  margin-top:4px;
  color:var(--muted2);
  font-size:8px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
}

.month-head{
  display:grid;
  grid-template-columns:46px 1fr 46px;
  gap:7px;
  align-items:center;
}

.nav-btn{
  height:44px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#151e27;
  color:white;
  font-weight:950;
  cursor:pointer;
}

.month-title{
  text-align:center;
  font-size:23px;
  font-weight:950;
}

.month-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px;
}

.month-jump{
  min-height:38px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#111820;
  color:#abb8c4;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.month-jump.active{
  color:var(--blue);
  border-color:rgba(34,199,255,.55);
  background:#0d202a;
}
