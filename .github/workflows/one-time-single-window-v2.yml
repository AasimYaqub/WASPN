name: WASPN One-Time Single Window Migration v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-single-window-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply single-window migration
        run: python scripts/migrate-single-window.py

      - name: Run policy and source regressions
        run: node --test tests/session-rules.test.cjs tests/source-regressions.test.cjs

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start local WASPN server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory . > /tmp/waspn-http.log 2>&1 &
          echo $! > /tmp/waspn-http.pid
          sleep 2

      - name: Run browser regressions
        run: python -u tests/frontend-smoke.py http://127.0.0.1:8000/

      - name: Commit single-window frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html live-risk.html compliance.html session-rules.js service-worker.js tests
          git diff --cached --check
          git commit -m 'Unify WASPN trading window to 06:30-11:00 ET'
          git push origin main
