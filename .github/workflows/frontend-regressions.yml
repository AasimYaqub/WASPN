name: WASPN Frontend Regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: waspn-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run all policy and source regressions
        run: node --test tests/*.test.cjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start local WASPN server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory . > /tmp/waspn-http.log 2>&1 &
          echo $! > /tmp/waspn-http.pid
          sleep 2

      - name: Run browser regressions
        run: python -u tests/frontend-smoke.py http://127.0.0.1:8000/
