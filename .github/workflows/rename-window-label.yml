name: One-time rename window label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-window-label.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace stale single-window label
        shell: bash
        run: |
          set -euo pipefail
          old="Primary"" Window"
          OLD="PRIMARY"" WINDOW"
          mapfile -t files < <(git grep -Il -e "$old" -e "$OLD" -- '*.html' '*.js' '*.cjs' '*.md' '*.webmanifest' || true)
          if ((${#files[@]})); then
            for file in "${files[@]}"; do
              OLD1="$old" OLD2="$OLD" perl -0pi -e 's/\Q$ENV{OLD1}\E/Window/g; s/\Q$ENV{OLD2}\E/WINDOW/g' "$file"
            done
          fi
          if git diff --quiet; then
            echo "No stale labels found."
            exit 0
          fi
          git diff --check
          node --test tests/session-rules.test.cjs tests/source-regressions.test.cjs
          python3 tests/frontend-smoke.py
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Primary Window label to Window"
          git push origin HEAD:main
