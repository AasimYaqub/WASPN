name: WASPN One-Time Cache Version Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-cache-version-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align shared rules cache version everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text()
              updated = text.replace('session-rules.js?v=2', 'session-rules.js?v=3')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          print('updated:', ', '.join(changed) or 'none')
          if 'session-rules.js?v=2' in ''.join(p.read_text() for p in Path('.').glob('*.html')):
              raise SystemExit('stale session-rules v2 reference remains')
          PY
      - name: Run policy and source regressions
        run: node --test tests/session-rules.test.cjs tests/source-regressions.test.cjs
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory . > /tmp/waspn-http.log 2>&1 &
          sleep 2
      - name: Run browser regressions
        run: python -u tests/frontend-smoke.py http://127.0.0.1:8000/
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --check
          git commit -m 'Align frontend session rules cache version'
          git push origin main
