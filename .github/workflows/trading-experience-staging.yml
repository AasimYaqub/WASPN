name: Trading Experience Staging
on:
  push:
    branches:
      - fix/trading-experience-polish
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trading-experience-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded polish
        run: python3 scripts/trading-experience-polish-v2.py
      - name: Run all source tests
        run: node --test tests/*.test.cjs
      - name: Commit tested polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add live-risk.html workflow-nav.js service-worker.js tests
          git commit -m "fix: center risk guardrails and strengthen trading UX checks"
          git push
