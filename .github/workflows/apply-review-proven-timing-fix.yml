name: Apply Review Proven Timing Fix

on:
  push:
    branches: [fix/review-proven-timing-render]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-proven-timing-render
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply focused frontend fix
        run: |
          python - <<'PY'
          from pathlib import Path

          nav = Path('workflow-nav.js')
          text = nav.read_text()
          old = '''      if(brokerProven) return;\n\n      card.querySelectorAll(".reconciled").forEach(node => {\n        if(node.textContent.includes("Broker timing reconciled")) node.remove();\n      });\n\n      card.querySelectorAll(".trade-row").forEach(row => {\n        const label = row.querySelector("span")?.textContent?.trim();\n        if(["Entry Time","Exit Time","Duration"].includes(label)) row.remove();\n      });\n\n      if(!card.querySelector(".timing-pending")){\n        const pending = document.createElement("div");\n        pending.className = "timing-pending";\n        pending.textContent = "Timing not broker-proven";\n        card.appendChild(pending);\n      }\n'''
          new = '''      card.querySelectorAll(".reconciled").forEach(node => {\n        if(node.textContent.includes("Broker timing reconciled")) node.remove();\n      });\n\n      card.querySelectorAll(".trade-row").forEach(row => {\n        const label = row.querySelector("span")?.textContent?.trim();\n        if(["Entry Time","Exit Time","Duration"].includes(label)) row.remove();\n      });\n\n      card.querySelectorAll(".timing-pending").forEach(node => node.remove());\n\n      if(brokerProven){\n        const reconciled = document.createElement("div");\n        reconciled.className = "reconciled";\n        reconciled.textContent = "Broker timing reconciled";\n        card.appendChild(reconciled);\n\n        const addTimingRow = (label, value) => {\n          const row = document.createElement("div");\n          row.className = "trade-row";\n          const name = document.createElement("span");\n          name.textContent = label;\n          const strong = document.createElement("strong");\n          strong.textContent = value;\n          row.append(name, strong);\n          card.appendChild(row);\n        };\n\n        addTimingRow("Entry Time", formatBrokerTime(trade.entryTime));\n        addTimingRow("Exit Time", formatBrokerTime(trade.exitTime));\n\n        const duration = typeof window.durationLabel === "function"\n          ? window.durationLabel(trade.entryTime, trade.exitTime)\n          : null;\n        if(duration) addTimingRow("Duration", duration);\n        return;\n      }\n\n      const pending = document.createElement("div");\n      pending.className = "timing-pending";\n      pending.textContent = "Timing not broker-proven";\n      card.appendChild(pending);\n'''
          if old not in text:
              raise SystemExit('expected Review timing block not found')
          nav.write_text(text.replace(old, new, 1))

          tests = Path('tests/source-regressions.test.cjs')
          text = tests.read_text()
          marker = "test('Review actively syncs broker journal timing and refreshes the open day', () => {"
          insert = '''test('Review actively replaces stale pending timing for broker-proven trades', () => {\n  const source = read('workflow-nav.js');\n  assert.match(source,/card\\.querySelectorAll\\(\"\\.timing-pending\"\\)\\.forEach/);\n  assert.match(source,/addTimingRow\\(\"Entry Time\", formatBrokerTime\\(trade\\.entryTime\\)\\)/);\n  assert.match(source,/addTimingRow\\(\"Exit Time\", formatBrokerTime\\(trade\\.exitTime\\)\\)/);\n  assert.match(source,/Broker timing reconciled/);\n});\n\n'''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          text = text.replace(marker, insert + marker, 1)
          text = text.replace('waspn-pwa-v11', 'waspn-pwa-v12', 1)
          tests.write_text(text)

          sw = Path('service-worker.js')
          text = sw.read_text()
          if 'waspn-pwa-v11' not in text:
              raise SystemExit('expected cache version not found')
          sw.write_text(text.replace('waspn-pwa-v11', 'waspn-pwa-v12', 1))
          PY
      - name: Run policy and source regressions
        run: node --test tests/session-rules.test.cjs tests/source-regressions.test.cjs
      - name: Commit tested patch
        run: |
          rm .github/workflows/apply-review-proven-timing-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow-nav.js tests/source-regressions.test.cjs service-worker.js .github/workflows/apply-review-proven-timing-fix.yml
          git commit -m "fix: render proven broker timing in review"
          git push origin HEAD:fix/review-proven-timing-render
