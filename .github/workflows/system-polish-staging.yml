name: System Polish Staging
on:
  push:
    branches:
      - fix/system-polish-all
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system-polish-all
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 scripts/apply-system-polish.py
      - name: Run source tests
        run: node --test tests/*.test.cjs
      - name: Commit tested patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add session-rules.js workflow-nav.js service-worker.js '*.html' tests
          git commit -m "feat: unify policy UI and harden PWA consistency"
          git push
