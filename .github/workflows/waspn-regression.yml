name: WASPN Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript syntax checks
        run: |
          node --check session-rules.js
          node --check tradezero-live.js
          node --check tradezero-journal.js
          node --check workflow-nav.js
          node --check service-worker.js

      - name: Session policy tests
        run: node --test tests/session-rules.test.cjs

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start local WASPN server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory . > /tmp/waspn-http.log 2>&1 &
          echo $! > /tmp/waspn-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/waspn-http.log
          exit 1

      - name: Browser regressions
        run: python -u tests/frontend-smoke.py http://127.0.0.1:8000/

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/waspn-http.pid ]; then
            kill "$(cat /tmp/waspn-http.pid)" 2>/dev/null || true
          fi
